name: EmuSuNi solo PS1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Permisos de los scripts
        run: |
          chmod +x scripts/*.sh toolchain/*.sh 2>/dev/null || true
          find scripts toolchain -type f \( -name '*.sh' -o -path '*/bin/*' \) -exec chmod +x {} +

      - name: Liberar disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Preparar entorno (solo PS1)
        run: sudo -i bash "$GITHUB_WORKSPACE/scripts/setup-ps1.sh"

      - name: Compilar
        run: >
          sudo -i env EMUSUNI_VERSION=00.99 bash "$GITHUB_WORKSPACE/scripts/build.sh"
          no-n64 no-nds no-psp no-dc no-sega no-arcade no-3ds no-pce

      - name: Empaquetar
        run: |
          # Otro identificador y titulo: se instala al lado del EmuSuNi oficial (solo en esta copia).
          sed -i 's/TITLE_ID=EMSN00001; TITLE="EmuSuNi"/TITLE_ID=EMSN00099; TITLE="EmuSuNi PS1"/' scripts/package.sh
          grep -n 'TITLE_ID=' scripts/package.sh
          grep -q 'TITLE_ID=EMSN00099' scripts/package.sh
          sudo -i env EMUSUNI_VERSION=00.99 bash "$GITHUB_WORKSPACE/scripts/package.sh" 00.99

      - name: Recoger resultados
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/salida"
          sudo cp -r /root/emusuni-build/out/. "$GITHUB_WORKSPACE/salida/" 2>/dev/null || true
          sudo find /root/emusuni-build -name '*.log' -exec cp {} "$GITHUB_WORKSPACE/salida/" \; 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/salida"
          ls -la "$GITHUB_WORKSPACE/salida"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emusuni-ps1
          path: salida/
